    <script>
      (function () {
        // Render a very small, simple horizontal bar histogram beneath the events row.
        function renderHistogram(hist) {
          try {
            if (!Array.isArray(hist) || hist.length === 0) return;
            var container = document.querySelector('.intro-blurb');
            if (!container) return;

            // remove existing histogram if present
            var existing = container.querySelector('.intro-histogram');
            if (existing) existing.remove();

            var wrapper = document.createElement('div');
            wrapper.className = 'intro-histogram';

            var max = Math.max.apply(null, hist.map(h => (typeof h === 'number' ? h : 0)));
            if (!isFinite(max) || max <= 0) max = 1;

            hist.forEach(function (value, i) {
              var barWrap = document.createElement('div');
              barWrap.className = 'intro-histogram-barwrap';

              var bar = document.createElement('div');
              bar.className = 'intro-histogram-bar';
              var v = (typeof value === 'number' ? value : 0);
              bar.style.width = Math.round((v / max) * 100) + '%';
              bar.title = String(v);

              var idx = document.createElement('div');
              idx.className = 'intro-histogram-index';
              idx.textContent = i + 1;

              barWrap.appendChild(idx);
              barWrap.appendChild(bar);
              wrapper.appendChild(barWrap);
            });

            // place after the events row if present, otherwise just append
            var eventsRow = container.querySelector('.intro-events-row');
            if (eventsRow && eventsRow.parentNode) {
              eventsRow.insertAdjacentElement('afterend', wrapper);
            } else {
              container.appendChild(wrapper);
            }
          } catch (e) {
            // silent
          }
        }

        var d = new Date();
        var yyyymmdd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        fetch('http://207.148.29.9:8080/' + yyyymmdd)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && typeof data.completes === 'number' && data.completes > 0) {
              var img = document.getElementById('logo');
              if (img) {
                img.src = 'heart.png';
                img.classList.remove('logo-spin');
                img.classList.add('logo-no-spin');
              }
            }

            // expose globally so other init code can render after timeline loads
            window.__leaderboardHistogram = Array.isArray(data && data.histogram) ? data.histogram : null;

            // try to render immediately if possible
            if (window.__leaderboardHistogram) {
              renderHistogram(window.__leaderboardHistogram);
            }
          })
          .catch(function () {});
      })();
    </script>
    <script>
      // Optional display overrides for event tags: raw tag -> label shown in pill.
      const EVENT_TAG_LABELS = {
        "FullMoon":"FULLMOON 🌕",
        "Uzi":"MAC11 ✨",
        "Shiruken":"SHIRUKEN ✨",
        // "CP1":"1️⃣",
        "CP2":"🆕",
        "Item":"🎁",
        "Jumpad":"🤸‍♂️",
        "Tunnel":"🔐"
      };
      const EVENT_TAG_ALT_TEXT = {
        "FullMoon":"Moon Cycle",
        "Uzi":"Weapon",
        "Shiruken":"Weapon",
        // "CP1":"New Content 1",
        "CP2":"New Content",
        "Item":"Pickup",
        "Jumpad":"Jumpad",
        "Tunnel":"Tunnel",
      };

      let introEventRowMode = 0;

      function getIntroTimelinePath(mode) {
        return mode === 0 ? 'timeline.json' : 'timeline_consoles.json';
      }

      function getIntroPlatformIcon(mode) {
        return ['steam_icon.png', 'ps_icon.png', 'switch_icon.png', 'xbox_icon.png'][mode] || 'steam_icon.png';
      }

      function getIntroPlatformAlt(mode) {
        return ['Steam', 'PlayStation', 'Nintendo Switch', 'Xbox'][mode] || 'Steam';
      }

      function runIntroEvents(eventsByDate, mode = 0) {
        const introBlurb = document.querySelector('.intro-blurb');
        if (!introBlurb) return;

        function getDateKey(d) {
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return year + '-' + month + '-' + day;
        }

        function toMmDd(date) {
          const mm = String(date.getMonth() + 1).padStart(2, '0');
          const dd = String(date.getDate()).padStart(2, '0');
          return mm + '/' + dd;
        }

        const now = new Date();
        now.setHours(0, 0, 0, 0);

        const startDate = new Date(now);
        startDate.setDate(startDate.getDate() - 1);

        const entries = [];
        for (let i = 0; i < 370 && entries.length < 5; i++) {
          const current = new Date(startDate);
          current.setDate(current.getDate() + i);
          const dateData = eventsByDate[getDateKey(current)] || {};
          let tags = [];
          let itemCount = 0;
          if (Array.isArray(dateData)) {
            tags = dateData;
          } else if (dateData && typeof dateData === 'object') {
            tags = dateData.Flags || [];
            itemCount = dateData.Items || 0;
          }
          const visibleTags = tags.filter(tag => {
            return Object.prototype.hasOwnProperty.call(EVENT_TAG_LABELS, String(tag));
          });

          if (visibleTags.length > 0) {
            const tagLabels = visibleTags.map(tag => {
              let label = EVENT_TAG_LABELS[String(tag)] || String(tag);
              if (String(tag) === 'Item' && itemCount > 0) {
                label += '×' + itemCount;
              }
              return label;
            }).join(' ');
            const altTexts = visibleTags.map(tag => {
              let a = EVENT_TAG_ALT_TEXT[String(tag)] || '';
              if (String(tag) === 'Item' && itemCount > 0) {
                a += (a ? ' ' : '') + '(' + itemCount + ')';
              }
              return a;
            }).filter(a => a).join(', ');
            entries.push({
              date: toMmDd(current),
              tag: tagLabels,
              alt: altTexts
            });
          }
        }

        introBlurb.innerHTML = '';
        if (entries.length === 0) return;

        const row = document.createElement('div');
        row.className = 'intro-events-row';

        const chip = document.createElement('div');
        chip.className = 'intro-event-chip';
        chip.style.cursor = 'pointer';
        const platform = document.createElement('img');
        platform.src = getIntroPlatformIcon(mode);
        platform.alt = getIntroPlatformAlt(mode);
        platform.addEventListener('click', function () {
          introEventRowMode = (introEventRowMode + 1) % 4;
          runIntroEventsRow(introEventRowMode);
        });
        chip.appendChild(platform);
        row.appendChild(chip);

        entries.forEach(entry => {
          const chip = document.createElement('div');
          chip.className = 'intro-event-chip';

          const dateEl = document.createElement('span');
          dateEl.className = 'intro-event-date';
          dateEl.textContent = entry.date;

          const tagEl = document.createElement('span');
          tagEl.className = 'intro-event-tag';
          tagEl.textContent = entry.tag;
          tagEl.title = entry.alt;

          chip.appendChild(dateEl);
          chip.appendChild(tagEl);
          row.appendChild(chip);
        });

        introBlurb.appendChild(row);

        // If histogram data was loaded earlier, render it now beneath the events row.
        if (window && window.__leaderboardHistogram) {
          try { renderHistogram(window.__leaderboardHistogram); } catch (e) {}
        }
      }

      function runIntroEventsRow(mode = 0) {
        introEventRowMode = mode;
        fetch(getIntroTimelinePath(mode))
          .then(r => r.json())
          .then(raw => {
            runIntroEvents(raw || {}, mode);
          })
          .catch(function () {});
      }

      runIntroEventsRow(0);
