    <meta charset="UTF-8" />

  <body>
    <!-- <div class="custom-cursor"></div> -->

    <canvas id="bg"></canvas>
    <div class="intro-blurb">
      <p>
        <b>LEADERBOARD CHALLENGE</b><br/> DURING THE FIRST WEEK OF THE GAME’S RELEASE (FRIDAY, APRIL 10 THROUGH THURSDAY, APRIL 16), THE TOP PLAYER ON THE DAILY GLOBAL LEADERBOARD ACROSS ALL PLATFORMS WILL RECEIVE A TAMASHIKA <a href = "https://edglrd.com/shop/products/tamashika-plushie">PLUSHIE</a>.
      </p>
    </div>
    <main class="page">
      <div class="page-stack">
        <!-- <a href="https://store.steampowered.com/app/2996080/TAMASHIKA/" class="logo-link"> -->
          <img id="logo" src="yy.png" alt="TAMASHIKA" class="logo-spin" />
        <!-- </a> -->
        <nav class="store-row" aria-label="Store links">
          <!-- Replace href with your URLs -->
          <a href="https://store.playstation.com/en-us/concept/10014922" class="store-btn" title="PlayStation"><img src="ps_icon.png" alt="PlayStation" /></a>
          <a href="https://store.steampowered.com/app/2996080/TAMASHIKA/" class="store-btn" title="Steam"><img src="steam_icon.png" alt="Steam" /></a>
          <a href="https://www.nintendo.com/us/store/products/tamashika-switch/" class="store-btn" title="Nintendo Switch"><img src="switch_icon.png" alt="Nintendo Switch" /></a>
          <a href="https://www.xbox.com/en-us/games/store/tamashika/9p43rgdpj62t" class="store-btn" title="Xbox"><img src="xbox_icon.png" alt="Xbox" /></a>
        </nav>
        <nav class="bottom-row" aria-label="">
          <!-- Replace href and img src with your assets -->
          <a href="https://edglrd.com/shop?c=tamashika" class="store-btn" title="Merch Store"><img src="shop.png" alt="Shop" /></a>
        </nav>
      </div>
    </main>

    <aside class="company-logos" aria-label="Company logos">
      <a href="https://quicktequila.com"><img src="company.png" alt="Company" class="company-logo company-logo--left" /></a>
      <a href="https://edglrd.com"><img src="publisher.png" alt="Publisher" class="company-logo company-logo--right" /></a>
    </aside>

    <script src="shader.js"></script>
    <script>
      (function () {
        var d = new Date();
        var yyyymmdd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        fetch('https://api.tamashika.com/' + yyyymmdd)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && typeof data.completes === 'number' && data.completes > 0) {
              var img = document.getElementById('logo');
              if (img) {
                img.src = 'heart.png';
                img.classList.remove('logo-spin');
                img.classList.add('logo-no-spin');
              }
            }
          })
          .catch(function () {});
      })();
    </script>
